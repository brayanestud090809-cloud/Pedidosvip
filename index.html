
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canaldetrabanotareasvip</title>
    <!-- Tailwind CSS para que se vea genial y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Script oficial de la API de Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md bg-slate-800 p-6 rounded-xl shadow-lg mt-6">
        <h1 id="tituloApp" class="text-2xl font-bold mb-4 text-cyan-400 text-center">Mis Tareas / Datos</h1>
        
        <!-- Formulario para agregar datos -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="inputDato" placeholder="Escribe algo aquí..." 
                class="flex-1 bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-cyan-400">
            <button id="btnGuardar" class="bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold px-4 py-2 rounded transition">
                Guardar
            </button>
        </div>

        <!-- Lista donde se mostrarán los datos desde Firebase -->
        <h2 class="text-lg font-semibold mb-2 text-slate-300">Guardados en la nube:</h2>
        <ul id="listaDatos" class="space-y-2">
            <li class="text-slate-500 text-sm">Cargando datos...</li>
        </ul>
    </div>

    <!-- SDKs de Firebase y Lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Inicializar Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const nombreUsuario = tg.initDataUnsafe.user.first_name;
            document.getElementById("tituloApp").textContent = `Hola, ${nombreUsuario}`;
        }

        // Tu configuración exacta de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAm3MEWKyFjT5L5ghRZCUyaDJPTj3HVZY",
            authDomain: "canaldetrabanotareasvip.firebaseapp.com",
            projectId: "canaldetrabanotareasvip",
            storageBucket: "canaldetrabanotareasvip.firebasestorage.app",
            messagingSenderId: "170165775394",
            appId: "1:170165775394:web:59503fdb4b9bae6dc0ae7b",
            measurementId: "G-RENYYDEH14"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const inputDato = document.getElementById("inputDato");
        const btnGuardar = document.getElementById("btnGuardar");
        const listaDatos = document.getElementById("listaDatos");

        // Guardar datos al hacer clic
        btnGuardar.addEventListener("click", async () => {
            const texto = inputDato.value.trim();
            if (texto === "") return;

            try {
                await addDoc(collection(db, "tareas"), {
                    texto: texto,
                    fecha: new Date(),
                    usuario: tg.initDataUnsafe?.user?.username || "Anónimo"
                });
                inputDato.value = "";
                
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            } catch (error) {
                console.error("Error al guardar: ", error);
                alert("Hubo un error al guardar el dato.");
            }
        });

        // Leer datos en tiempo real de Firestore
        onSnapshot(collection(db, "tareas"), (snapshot) => {
            listaDatos.innerHTML = "";
            if (snapshot.empty) {
                listaDatos.innerHTML = `<li class="text-slate-500 text-sm">No hay registros todavía.</li>`;
                return;
            }
            snapshot.forEach((doc) => {
                const data = doc.data();
                const li = document.createElement("li");
                li.className = "bg-slate-700 p-3 rounded text-white flex justify-between items-center";
                li.textContent = data.texto;
                listaDatos.appendChild(li);
            });
        });
    </script>
</body>
</html>
